version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: document_copilot
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Vector Database
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Backend API
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres/document_copilot
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - KIMI_API_URL=https://api.openai.com/v1/chat/completions
      - KIMI_API_KEY=${KIMI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - qdrant
    ports:
      - "8000:8000"

  # Frontend UI
  frontend:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
