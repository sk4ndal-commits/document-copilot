version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: document_copilot
    ports:
      - "5432:5432"  # Map to host so local backend can connect
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  # Vector Database
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_dev_data:/qdrant/storage

volumes:
  postgres_dev_data:
  qdrant_dev_data:
